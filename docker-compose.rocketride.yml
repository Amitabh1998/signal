services:
  rocketride:
    image: ghcr.io/rocketride-org/rocketride-engine:latest
    # The published image is amd64-only; on Apple Silicon it runs under emulation.
    # Prefer the native RocketRide server there, or set ROCKETRIDE_PLATFORM.
    platform: ${ROCKETRIDE_PLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:5565:5565"
    environment:
      ROCKETRIDE_OPENROUTER_KEY: "${ROCKETRIDE_OPENROUTER_KEY:?Add ROCKETRIDE_OPENROUTER_KEY to .env}"
    volumes:
      - rocketride-data:/opt/data
    restart: unless-stopped

volumes:
  rocketride-data:
